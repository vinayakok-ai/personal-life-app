<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2 · Quiet dark / focused</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#0B0D11; --screen:#14171C; --surface:#1A1E25; --ink:#E9E5DC; --muted:#8A909B;
 --line:#262B33; --accent:#E6A23C;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:'Hanken Grotesk',sans-serif;color:var(--ink);display:flex;justify-content:center;padding:34px 16px;min-height:100vh;-webkit-font-smoothing:antialiased}
.screen{width:390px;background:var(--screen);border-radius:34px;padding:32px 26px 38px;box-shadow:0 30px 70px -26px rgba(0,0,0,.7);border:1px solid #1f242b}
.eyebrow{font-family:'Space Grotesk',sans-serif;font-size:11.5px;letter-spacing:.22em;color:var(--muted);font-weight:500}
.top h1{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:29px;line-height:1.1;margin:11px 0 6px;letter-spacing:-.02em}
.lede{color:var(--muted);font-size:15px}
.block{margin-top:30px}
.block-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.block-head h2{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:18px}
.progress{font-family:'Space Grotesk',sans-serif;font-size:13px;color:var(--accent);font-weight:500}
.chain{list-style:none}
.chain li{position:relative;padding:12px 0 12px 30px;font-size:16px;border-bottom:1px solid var(--line)}
.chain li:last-child{border-bottom:0}
.chain li::before{content:"";position:absolute;left:2px;top:15px;width:13px;height:13px;border-radius:50%;border:1.5px solid #353b45}
.chain li.is-done{color:var(--muted)}
.chain li.is-done::before{background:var(--accent);border-color:var(--accent)}
.chain li.is-done::after{content:"";position:absolute;left:6px;top:18px;width:4px;height:7px;border:solid #14171C;border-width:0 1.6px 1.6px 0;transform:rotate(45deg)}
.chain li.is-now{font-weight:500}
.chain li.is-now::before{border-color:var(--accent);box-shadow:0 0 0 3px rgba(230,162,60,.16),0 0 14px rgba(230,162,60,.35)}
.chain li em{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:3px}
.capture{margin-top:28px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:17px 18px;font-family:'Space Grotesk',sans-serif;font-size:16px;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.capture span{font-size:11px;color:var(--accent);letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.today{margin-top:22px;display:flex;gap:10px}
.today>div{flex:1;display:flex;flex-direction:column;gap:3px;padding:14px 13px;background:var(--surface);border-radius:14px;border:1px solid var(--line)}
.today .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.today .v{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:600}
.evening{margin-top:30px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chips span{font-size:13.5px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);color:var(--ink);background:var(--surface)}
</style>
</head>
<body>
<div class="screen">
  <header class="top">
    <p class="eyebrow">SUN · 7 JUNE</p>
    <h1>Good morning, Vinayak</h1>
    <p class="lede">Let's win the morning.</p>
  </header>
  <section class="block">
    <div class="block-head"><h2>This morning</h2><span class="progress">2 / 6</span></div>
    <ol class="chain">
      <li class="is-done">Out of bed</li>
      <li class="is-done">Bathroom</li>
      <li class="is-now">Workout — 5 min<em>after the bathroom</em></li>
      <li>Brush &amp; shower</li>
      <li>Smoothie</li>
      <li>Start work</li>
    </ol>
  </section>
  <button class="capture">How are you feeling?<span>hold to talk</span></button>
  <section class="today">
    <div><span class="k">Spent</span><span class="v">₹240</span></div>
    <div><span class="k">Steps</span><span class="v">1,240</span></div>
    <div><span class="k">Meals</span><span class="v">0 / 2</span></div>
  </section>
  <section class="evening">
    <div class="block-head"><h2>Free tonight?</h2></div>
    <div class="chips"><span>Movie trailer</span><span>Improve this app</span><span>Call family</span><span>New project</span></div>
  </section>
</div>
</body>
</html>
