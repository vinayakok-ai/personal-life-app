<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B · Neo-brutalist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4E83F;--paper:#FFFDF4;--ink:#0E0E0C;--accent:#2348FF;--accent2:#FF4D8D}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:'Space Mono',monospace;color:var(--ink);display:flex;justify-content:center;padding:34px 16px;min-height:100vh}
.screen{width:390px;background:var(--paper);border:3px solid var(--ink);box-shadow:11px 11px 0 var(--ink);padding:22px 20px 28px}
.tag{display:inline-block;background:var(--ink);color:var(--bg);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:5px 9px}
h1{font-family:'Archivo',sans-serif;font-weight:800;font-size:37px;line-height:.93;text-transform:uppercase;letter-spacing:-.02em;margin:14px 0 0}
.lede{font-size:12.5px;margin-top:8px;color:#33312a}
.box{border:3px solid var(--ink);margin-top:18px}
.box-h{background:var(--ink);color:#fff;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:7px 12px;display:flex;justify-content:space-between}
.stack{list-style:none}
.stack li{display:flex;align-items:center;gap:12px;padding:11px 12px;border-bottom:2px solid var(--ink);font-family:'Archivo',sans-serif;font-weight:600;font-size:16px}
.stack li:last-child{border-bottom:0}
.cb{width:19px;height:19px;border:2.5px solid var(--ink);flex:none;display:grid;place-items:center;font-size:12px;font-weight:800}
.stack li.done{color:#94907e}
.stack li.done .cb{background:var(--ink);color:var(--paper)}
.stack li.now{background:#e9edff}
.stack li.now .cb{background:var(--accent);border-color:var(--ink);color:#fff}
.stack em{display:block;font-family:'Space Mono',monospace;font-size:11px;color:#6b6857;font-weight:400}
.cap{margin-top:18px;width:100%;background:var(--accent2);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:15px;font-family:'Archivo',sans-serif;font-weight:700;font-size:16px;text-transform:uppercase;color:var(--ink);cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:center}
.cap span{font-family:'Space Mono',monospace;font-size:10px;text-transform:none}
.stats{display:flex;margin-top:18px;border:3px solid var(--ink)}
.stats div{flex:1;padding:12px;border-right:3px solid var(--ink)}
.stats div:last-child{border-right:0}
.stats .k{font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.stats .v{font-family:'Archivo',sans-serif;font-weight:800;font-size:21px;display:block;margin-top:3px}
.tags{margin-top:18px;display:flex;flex-wrap:wrap;gap:9px}
.tags span{background:var(--paper);border:2.5px solid var(--ink);padding:6px 11px;font-size:12px;font-weight:700;box-shadow:3px 3px 0 var(--ink)}
</style>
</head>
<body>
<div class="screen">
  <span class="tag">Sun 07 Jun · 07:12</span>
  <h1>Good morning,<br>Vinayak</h1>
  <p class="lede">// two down. next: move for five minutes.</p>
  <div class="box">
    <div class="box-h"><span>This morning</span><span>02 / 06</span></div>
    <ul class="stack">
      <li class="done"><span class="cb">✓</span>Out of bed</li>
      <li class="done"><span class="cb">✓</span>Bathroom</li>
      <li class="now"><span class="cb"></span><span>Workout — 5 min<em>after the bathroom</em></span></li>
      <li><span class="cb"></span>Brush &amp; shower</li>
      <li><span class="cb"></span>Smoothie</li>
      <li><span class="cb"></span>Start work</li>
    </ul>
  </div>
  <button class="cap">How are you feeling?<span>hold to talk</span></button>
  <div class="stats">
    <div><span class="k">Spent</span><span class="v">₹240</span></div>
    <div><span class="k">Steps</span><span class="v">1,240</span></div>
    <div><span class="k">Meals</span><span class="v">0/2</span></div>
  </div>
  <div class="tags"><span>Movie trailer</span><span>This app</span><span>Call family</span><span>New project</span></div>
</div>
</body>
</html>
